name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "session/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Run tests
        run: bash tests/run.sh
